[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-lens"
version = "0.1.0"
description = "AI agent that reads Threads via Playwright screenshots + LLM vision — no API needed"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "openai>=1.0",
    "rich>=13.0",
    "click>=8.0",
    "mcp>=1.0",
]

[project.scripts]
tlens = "threads_lens.cli:main"

[tool.setuptools.packages.find]
include = ["threads_lens*"]
